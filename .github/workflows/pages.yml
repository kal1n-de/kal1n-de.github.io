name: Publish uro-log
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site release
        uses: actions/checkout@v4
      - name: Restore and verify release
        shell: bash
        run: |
          set -euo pipefail
          cat release-20261123.part-{00..08} > "$RUNNER_TEMP/uro-log.zip"
          echo "4dc06bd210bc0bb09a0d5a6c9ee3cc80a648adcef85cb89bc052779901f8c5cb  $RUNNER_TEMP/uro-log.zip" | sha256sum --check
          mkdir -p _site
          unzip -q "$RUNNER_TEMP/uro-log.zip" -d _site
          test -s _site/index.html
          test -s _site/de/index.html
          test -s _site/ru/index.html
          test -s _site/de/downloads/manifest.json
          test -s _site/ru/downloads/manifest.json
          test -s _site/release.json
          test -s _site/robots.txt
          test -s _site/sitemap.xml
          test ! -e _site/uro-log_hbs_20261118_0229.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
